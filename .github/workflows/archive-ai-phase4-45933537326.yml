name: Archive verified Phase 4 evidence (run 45933537326)
on:
  push:
    branches:
      - research/ai-computational-evaluation
    paths:
      - '.github/workflows/archive-ai-phase4-45933537326.yml'
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.ref == 'refs/heads/research/ai-computational-evaluation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download original consolidated Phase 4 artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-computational-phase4-063829d54a087e1abb8d9a1932729c3466664c13
          run-id: 45933537326
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-phase4
      - name: Verify exact original files against audited hashes
        working-directory: ${{ runner.temp }}/verified-phase4
        run: |
          sha256sum --check <<'HASHES'
          f556676e17ebe8d26c807209006c5f8c897a05d9136f8c235ea8fa9f85d1ba72  baseline_recheck.csv
          1b923a67d3c009ee3dd7947d3fd55c0daa37f7fd9ab8b0bbe3843efeb051ff55  phase4_metrics.csv
          63a11c58322c64ea9335c958389f11393be0e85b2a5a6c3daed2e5ce47da5840  phase4_manifest.json
          a2704c2497c6c9d48fbbd2e6522e61a71f021b413cd9553e6957dca97e46ba77  robustness_by_magnitude.csv
          b548490d39d3f675ccedf0c438b1d73006e3c3751bc2959da21e0eab7f63a4b9  robustness_results.csv
          a9a91948576f2cd888452ee74ad4210799ddaaeb897240961ca907c2baa3e488  sensitivity_results.csv
          HASHES
      - name: Archive original bytes on experiment branch only
        env:
          ARCHIVE_ROOT: research/ai_computational/results/phase4/run-45933537326
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/research/ai-computational-evaluation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$ARCHIVE_ROOT"
          test -z "$(git status --porcelain)"
          mkdir -p "$ARCHIVE_ROOT"
          cp "$RUNNER_TEMP/verified-phase4/baseline_recheck.csv" "$ARCHIVE_ROOT/baseline_recheck.csv"
          cp "$RUNNER_TEMP/verified-phase4/phase4_metrics.csv" "$ARCHIVE_ROOT/phase4_metrics.csv"
          cp "$RUNNER_TEMP/verified-phase4/phase4_manifest.json" "$ARCHIVE_ROOT/phase4_manifest.json"
          cp "$RUNNER_TEMP/verified-phase4/robustness_by_magnitude.csv" "$ARCHIVE_ROOT/robustness_by_magnitude.csv"
          cp "$RUNNER_TEMP/verified-phase4/robustness_results.csv" "$ARCHIVE_ROOT/robustness_results.csv"
          cp "$RUNNER_TEMP/verified-phase4/sensitivity_results.csv" "$ARCHIVE_ROOT/sensitivity_results.csv"
          git add -f -- "$ARCHIVE_ROOT/"
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in "$ARCHIVE_ROOT/"*) ;; *) exit 1 ;; esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research(ai): archive exact verified Phase 4 experimental results"
          git push origin HEAD:refs/heads/research/ai-computational-evaluation
          git rev-parse HEAD
